[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collective-phase"
version = "0.1.0"
description = "Research prototype for collective compilation of equal-angle parity phases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML==6.0.2",
  "numpy>=1.24,<3",
  "pygridsynth==2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
collective-phase = "collective_phase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

