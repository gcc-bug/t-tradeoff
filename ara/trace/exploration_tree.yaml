  provenance: ai-executed
  timestamp: 2026-09-17T16:40+08:00
  also_depends_on:
  - N08
  result: The initial baseline forced HWP on every batch and produced eight apparent new model points
    across four cases. These outcomes are superseded by the strengthened baseline.
