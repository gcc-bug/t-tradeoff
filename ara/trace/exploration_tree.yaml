- id: N10
  type: dead_end
  title: Discard gains caused by forced HWP on remainder batches
  provenance: ai-executed
  timestamp: 2026-09-17T16:40+08:00
  also_depends_on:
  - N09
  hypothesis: The eight initial model points represent advantages over fair batching references.
  failure_mode: Forcing HWP on unprofitable baseline batches inflated reference costs; allowing direct
    fallback removed seven apparent gains.
  lesson: Permit independent direct fallback per batch and automatic eligible layouts before attributing
    a gain to mixed construction synthesis.
  evidence:
  - evidence/hwp-pareto/hwp-pareto-study.md
  status: resolved
