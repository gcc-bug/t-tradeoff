schema_version: 1
purpose: >-
  Development comparison of resumable waves, selective refinement and global
  resource-load relaxation. No new arithmetic construction or published-method claim.
frozen_before_execution: '2026-09-22'
total_error: 1.0e-4
seed: 0
max_terms: 10
max_batch: 8
orderings: [staged, readiness]
budgets_seconds: [1, 3]
repeats: 3
modes: [cold, warm]
methods: [serial_graph, serial_transfer, upfront, interleaved, interleaved_coupled, upfront_coupled, batching]
queries:
  - {id: count, weights: ['1', '0', '0'], ancilla: 4, depth: null}
  - {id: constrained_count, weights: ['1', '0', '0'], ancilla: 3, depth: 200}
cases:
  - {id: native_3, kind: native, n: 3, angle: '0.173'}
  - {id: native_6, kind: native, n: 6, angle: '0.173'}
  - {id: native_7, kind: native, n: 7, angle: '0.173'}
  - {id: native_9, kind: native, n: 9, angle: '0.173'}
  - {id: groups_3_2, kind: groups, groups: [{size: 3, angle: '0.173'}, {size: 2, angle: '0.291'}]}
  - {id: overlapping_6, kind: masks, n: 3, masks: [1, 2, 3, 4, 5, 6], angle: '0.173'}
reference_seconds: 15
cache_policy: >-
  Fresh synthesis cache per method/repetition/budget/mode/case. Cold runs the first
  query. Warm runs both queries in order and reuses primitive/template caches.
  Each query gets the declared budget; the first query pays input loading and
  library setup. Upfront refinement and final verification are included. No
  cache reuse between independent trials; method order rotates by repetition.
limits: >-
  Existing development inputs only, no holdout claim. Deadlines are cooperative;
  one atomic synthesis/verification and uninterruptible descriptor initialization
  can overrun, with actual time and overrun recorded. Timed batching includes
  eager construction, choice enumeration, scheduling and emitted verification.
  Separate longer reference frontiers and local-choice diagnostics are not charged
  to timed methods and are never imported as seeds or bounds.
