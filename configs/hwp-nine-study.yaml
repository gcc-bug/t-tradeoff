schema_version: 1
purpose: Diagnose native-nine constrained failure and separate scalar from endpoint certificates.
frozen_before_execution: '2026-09-23'
total_error: 1.0e-4
seed: 0
max_terms: 10
max_batch: 8
orderings: [staged, readiness]
budgets_seconds: [1, 3, 10, 30]
repeats: 3
modes: [cold, warm]
methods: [original, ties, ties_progress, ties_partition, combined, partition]
case: {id: native_9, kind: native, n: 9, angle: '0.173'}
query: {id: constrained_count, weights: ['1', '0', '0'], ancilla: 3, depth: 200}
warmup: {id: count, weights: ['1', '0', '0'], ancilla: 4, depth: null}
reference_seconds: 60
coupled_cases:
  - {id: coordination_3_3, kind: groups, groups: [{size: 3, angle: '0.173'}, {size: 3, angle: '0.291'}]}
  - {id: fresh_3_3, kind: groups, groups: [{size: 3, angle: '0.217'}, {size: 3, angle: '0.319'}]}
coupled_depths: [50, 60, 100, 109, 110, 120]
coupled_ancillas: [1, 2]
coupled_budget: 3
cache_policy: >-
  Fresh synthesis and library caches per method/repeat/budget/mode. Cold runs the
  constrained query directly. Warm first runs count with the same method and a
  separate equal budget; only that trial's caches persist. Setup and all emitted
  verification are charged. Imports are preloaded without synthesizing rotations;
  startup and serialization are excluded. Rotate method order by repeat.
limits: >-
  Native nine and the original coordination case are development inputs. The new
  angle pair is a declared prospective probe, not evidence of broad generalization.
  Partition is exact only for checked exchangeable disjoint singleton predicates.
  Separate completed references and seeded diagnostics never feed timed queries.
  Budgets are cooperative and actual deadline overruns are reported.
